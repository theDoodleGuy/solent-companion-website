<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Roboto Flex, Roboto, system-ui, sans-serif">
  <rect width="480" height="300" rx="16" fill="#0B1D2A"/>
  <text x="240" y="64" text-anchor="middle" font-size="44" font-weight="300" fill="#E6EEF3">14:30</text>
  <text x="240" y="90" text-anchor="middle" font-size="13" fill="#A9BBC7">Saturday 16 May</text>
  <!-- Underway notification -->
