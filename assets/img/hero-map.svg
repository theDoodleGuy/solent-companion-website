<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" font-family="Roboto Flex, Roboto, system-ui, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="12" y="12" width="336" height="716" rx="28"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#C21A1A" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="360" height="740" rx="40" fill="#0B1D2A"/>
  <g clip-path="url(#screen)">
    <rect x="12" y="12" width="336" height="716" fill="#DCEBF5"/>
    <!-- Mainland (top) and the Isle of Wight (bottom) -->
    <path d="M12 12 H348 V150 C310 160 290 140 262 158 C236 176 214 150 190 170 C168 188 150 168 128 186 C104 206 84 180 60 196 C40 210 24 200 12 206 Z" fill="#EEF0E6"/>
    <path d="M12 560 C40 540 70 556 100 536 C130 518 160 540 196 522 C230 506 262 528 296 512 C318 502 334 510 348 504 V728 H12 Z" fill="#EEF0E6"/>
    <!-- Shallows: Bramble Bank -->
    <ellipse cx="236" cy="380" rx="40" ry="16" fill="#C7DDEA"/>
    <!-- Channel buoys -->
    <g fill="#0F6E4E"><rect x="44" y="330" width="6" height="10"/><rect x="80" y="282" width="6" height="10"/></g>
    <g fill="#C21A1A"><circle cx="208" cy="330" r="4"/><circle cx="176" cy="268" r="4"/></g>
    <!-- Notice area: dashed polygon with calendar badge -->
    <path d="M250 430 L322 418 L330 474 L262 488 Z" fill="#6A3FB0" fill-opacity="0.18" stroke="#6A3FB0" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="280" y="438" width="22" height="20" rx="3" fill="#fff" stroke="#6A3FB0" stroke-width="2"/>
    <rect x="280" y="438" width="22" height="6" fill="#6A3FB0"/>
    <!-- Ship heading north-west, with MPZ ahead and dashed padding -->
    <g transform="translate(70 0) rotate(-32 120 420)">
      <rect x="92" y="230" width="56" height="188" fill="none" stroke="#C21A1A" stroke-width="1.5" stroke-dasharray="5 4"/>
      <rect x="104" y="244" width="32" height="172" fill="url(#hatch)" stroke="#C21A1A" stroke-width="2.5"/>
      <path d="M120 404 L128 420 L128 470 L112 470 L112 420 Z" fill="#0B1D2A"/>
    </g>
    <rect x="186" y="478" width="150" height="40" rx="8" fill="#fff" stroke="#D3DEE6"/>
    <text x="196" y="495" font-size="12" font-weight="700" fill="#0B1D2A">NORTHERN JUBILEE</text>
    <text x="196" y="510" font-size="11" fill="#3D5566">290 m · 11 kn · MPZ</text>
    <!-- Fast ferry: diamond nose, speed vector -->
    <g transform="rotate(20 290 300)">
      <line x1="290" y1="300" x2="290" y2="252" stroke="#B25E00" stroke-width="2.5"/>
      <path d="M290 296 L297 306 L297 324 L283 324 L283 306 Z" fill="#B25E00"/>
    </g>
    <!-- Tide gates -->
    <circle cx="236" cy="380" r="11" fill="#0F6E4E"/>
    <path d="M231 380 l3.5 3.5 l6 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 512 l12 21 h-24 z" fill="#C21A1A"/>
    <rect x="68.8" y="518" width="2.4" height="8" fill="#fff"/><rect x="68.8" y="528" width="2.4" height="2.4" fill="#fff"/>
    <!-- Own boat: arrow with accuracy circle -->
    <circle cx="270" cy="200" r="20" fill="#0B5CAD" fill-opacity="0.15"/>
    <path d="M270 186 L279 210 L270 205 L261 210 Z" fill="#0B5CAD" stroke="#fff" stroke-width="2" transform="rotate(-60 270 200)"/>
    <!-- Top bar -->
    <rect x="12" y="12" width="336" height="40" fill="#fff" fill-opacity="0.92"/>
    <text x="28" y="38" font-size="14" font-weight="600" fill="#0B1D2A">14:30</text>
    <rect x="260" y="60" width="76" height="28" rx="8" fill="#fff" stroke="#0F6E4E" stroke-width="1.5"/>
    <circle cx="274" cy="74" r="4" fill="#0F6E4E"/>
    <text x="284" y="79" font-size="13" font-weight="600" fill="#0F6E4E">Live</text>
    <!-- Lookout caption -->
    <rect x="24" y="580" width="312" height="44" rx="10" fill="#fff" stroke="#D3DEE6"/>
    <text x="180" y="607" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C21A1A">Advisory only — keep a lookout and monitor VHF 12</text>
    <!-- Bottom navigation -->
    <rect x="12" y="640" width="336" height="88" fill="#fff"/>
    <rect x="44" y="652" width="56" height="28" rx="14" fill="#0B5CAD" fill-opacity="0.14"/>
    <g font-size="12" text-anchor="middle" fill="#3D5566">
      <text x="72" y="700" font-weight="700" fill="#0B5CAD">Map</text>
      <text x="144" y="700">Tides</text>
      <text x="216" y="700">Notices</text>
      <text x="288" y="700">Settings</text>
    </g>
    <path d="M62 674 l7 -12 l7 9 l7 -5 v14 h-21 z" fill="#0B5CAD"/>
    <path d="M132 672 q6 -8 12 0 t12 0" fill="none" stroke="#3D5566" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="206" y="660" width="20" height="18" rx="3" fill="none" stroke="#3D5566" stroke-width="2.2"/>
    <circle cx="288" cy="669" r="8" fill="none" stroke="#3D5566" stroke-width="2.2"/>
  </g>
</svg>
