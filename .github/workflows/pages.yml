name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the site, not the design notes.
      - name: Refuse to publish unfinished placeholders
        run: |
          if grep -rnE "OWNER-PLACEHOLDER|\[date\]|\[backend domain\]|\[n\] days|\[your " index.html privacy.html thanks.html; then
            echo "Placeholders still in the pages: finish them first."; exit 1
          fi
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html privacy.html thanks.html 404.html robots.txt sitemap.xml favicon.ico google630a38aaba1ba427.html .nojekyll assets _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
